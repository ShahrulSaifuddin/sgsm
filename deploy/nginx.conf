# SGSM load balancer / reverse proxy.
#
# Sits in front of the two `sgsm-app` (Next.js standalone) replicas started
# by docker-compose.yml. Terminates client connections, load-balances across
# app1/app2, adds edge caching + compression, and forwards `/api/health` for
# container healthchecks / external monitoring.
#
# Validation: nginx is not installed on this Windows dev machine, so this was
# validated by a careful syntax read-through (matching braces, one directive
# per statement terminated with `;`, valid context nesting) rather than
# `nginx -t`. See deploy/README.md for how to run `nginx -t` against this
# file from inside the `nginx` container before relying on it in production.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  # Default is plenty for a two-replica site; raise alongside worker_processes
  # if traffic grows.
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;

  # Generous enough for the membership form + any admin uploads; small enough
  # to stop trivially large request bodies from tying up a worker.
  client_max_body_size 10m;

  # Conservative timeouts: long enough that a cold Next.js server-render or a
  # slow client on a hotel Wi-Fi doesn't get cut off, short enough that a
  # hung backend doesn't pin a worker connection indefinitely.
  proxy_connect_timeout   5s;
  proxy_send_timeout      30s;
  proxy_read_timeout      30s;
  send_timeout            30s;
  keepalive_timeout       65s;

  # ---------------------------------------------------------------------
  # Compression
  # ---------------------------------------------------------------------

  # gzip: universally supported fallback.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # brotli: better ratio than gzip for text; requires the ngx_brotli module
  # (bundled in the `nginx` image tag used by docker-compose.yml, e.g.
  # `fholzer/nginx-brotli` or a build with --add-module=ngx_brotli). Falls
  # back to gzip automatically for clients/builds without brotli support --
  # these two blocks are intentionally independent, not either/or.
  brotli on;
  brotli_comp_level 6;
  brotli_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # ---------------------------------------------------------------------
  # Proxy cache for HTML (stale-while-revalidate behaviour)
  # ---------------------------------------------------------------------
  # 10m keys_zone =~ ~80k cached keys, 1g max on-disk cache. `use_stale
  # updating` is what gives SWR semantics: while one request refreshes an
  # expired entry in the background, concurrent requests keep getting the
  # stale copy instead of all queueing on the origin.
  proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html_cache:10m max_size=1g inactive=60m use_temp_path=off;

  # ---------------------------------------------------------------------
  # Upstream: the two app replicas
  # ---------------------------------------------------------------------
  # least_conn: routes each new request to whichever replica currently has
  # the fewest open connections -- a better fit than round-robin for
  # server-rendered pages whose render time varies per route.
  # keepalive 32: keeps up to 32 idle keepalive connections per worker open
  # to the upstreams, avoiding a fresh TCP+HTTP handshake per proxied request.
  # max_fails/fail_timeout: passive health check -- 3 failed proxy attempts
  # within 30s takes a replica out of rotation for 30s, then nginx retries it.
  upstream sgsm_app {
    least_conn;
    server app1:3000 max_fails=3 fail_timeout=30s;
    server app2:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Shared proxy headers/settings for every location that forwards to the
  # Next.js upstream, so the app can see the real client IP/protocol/host
  # (Next.js redirects, canonical URLs and the security headers in
  # next.config.ts all depend on getting these right behind a proxy).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    # ---- Health check target for the load balancer / uptime monitors ----
    # Proxies straight to the app's own /api/health (src/app/api/health/route.ts),
    # which returns 200 only when it can query SQLite, 503 otherwise. Never
    # cached -- the route itself also sets Cache-Control: no-store.
    location = /healthz {
      proxy_pass http://sgsm_app/api/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache off;
      access_log off;
    }

    # ---- Long-lived immutable static assets ----
    # Next's hashed build output. Filenames change on every deploy, so caching
    # forever at both nginx and the browser is safe.
    location /_next/static/ {
      proxy_pass http://sgsm_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Optimized/original images served from public/images (A.1 path rule) --
    # same immutability guarantee as the static bundle.
    location /images/ {
      proxy_pass http://sgsm_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # PDFs and other downloads from public/files -- same treatment.
    location /files/ {
      proxy_pass http://sgsm_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- API routes ----
    # Each GET route handler under src/app/api/* already sets its own
    # Cache-Control (public, s-maxage=…, stale-while-revalidate=…) and ETag,
    # or no-store for /api/membership and /api/health -- nginx just proxies
    # and does not second-guess those with its own cache here.
    location /api/ {
      proxy_pass http://sgsm_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache off;
    }

    # ---- Everything else: server-rendered HTML ----
    # Cached briefly at the edge with stale-while-revalidate semantics:
    # `proxy_cache_use_stale updating` serves the last-known-good copy to
    # every request that arrives while one background request refreshes an
    # expired entry, instead of piling everyone up on the origin.
    location / {
      proxy_pass http://sgsm_app;
      proxy_http_version 1.1;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache html_cache;
      proxy_cache_valid 200 60s;
      proxy_cache_valid 404 10s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
