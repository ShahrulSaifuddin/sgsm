# SGSM production-shaped stack: nginx load balancer + 2 app replicas.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
#
# See deploy/README.md for build/seed/scale instructions.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.sgsm.com.my}
      - SGSM_DB_PATH=/app/data/sgsm.db
    volumes:
      - sgsm_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  app2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.sgsm.com.my}
      - SGSM_DB_PATH=/app/data/sgsm.db
    volumes:
      - sgsm_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Shared named volume so both replicas read/write the same SQLite file
# (data/sgsm.db) instead of each having its own copy seeded independently.
# node-sqlite3-wasm's single-writer model (src/lib/db/pool.ts) means only one
# process should hold the write connection at a time in the general case;
# for two read-mostly web replicas sharing one file this is acceptable, but a
# heavier write workload would want a real client/server database instead.
volumes:
  sgsm_data:
